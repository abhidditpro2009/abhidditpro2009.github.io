cta{font-size:13px;font-weight:600;text-decoration:none;padding:8px 16px;background:var(--clay);color:#FBF8F3;border-radius:7px;transition:background 120ms;white-space:nowrap}\n.n-cta:hover{background:var(--clay-h)}\n\n/* ── Scroll reveal ── */\n.rv{opacity:0;transform:translateY(24px);transition:opacity 550ms var(--ease),transform 550ms var(--ease)}\n.rv.vis{opacity:1;transform:none}\n.d1{transition-delay:80ms}.d2{transition-delay:160ms}.d3{transition-delay:240ms}\n\n/* ── Hero ── */\n#hero{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:120px var(--g) 72px;max-width:var(--max);margin:0 auto}\n.h-eye{font-family:var(--font-m);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--clay);margin-bottom:20px}\n.h-h1{font-family:var(--font-d);font-weight:400;font-size:clamp(46px,6.5vw,86px);line-height:1.03;letter-spacing:-.025em;color:var(--fg);margin-bottom:30px;max-width:880px}\n.h-h1 .it{font-style:italic;color:var(--clay)}\n.h-sub{font-size:18px;line-height:1.65;color:var(--fg3);max-width:600px;margin-bottom:38px}\n.h-acts{display:flex;gap:14px;flex-wrap:wrap}\n.bp{display:inline-flex;align-items:center;gap:8px;background:var(--clay);color:#FBF8F3;font-size:15px;font-weight:600;text-decoration:none;padding:14px 26px;border-radius:8px;transition:background 120ms,transform 120ms}\n.bp:hover{background:var(--clay-h);transform:translateY(-1px)}\n.bs{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--fg2);font-size:15px;font-weight:600;text-decoration:none;padding:14px 26px;border-radius:8px;border:1.5px solid var(--line2);transition:border-color 120ms,background 120ms}\n.bs:hover{border-color:var(--fg3);background:var(--bg1)}\n.h-scroll{margin-top:52px;display:flex;align-items:center;gap:10px;font-family:var(--font-m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg4)}\n.h-scroll span:first-child{width:44px;height:1px;background:var(--line2);display:block}\n\n/* ── Stats ── */\n#stats{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg1)}\n.st-in{max-width:var(--max);margin:0 auto;padding:28px var(--g);display:grid;grid-template-columns:repeat(4,1fr)}\n.st{padding:0 24px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}\n.st:first-child{padding-left:0}.st:last-child{border-right:none}\n.st-n{font-family:var(--font-d);font-size:40px;line-height:1;color:var(--fg);letter-spacing:-.02em}\n.st-n .u{font-family:var(--font-s);font-size:20px;color:var(--clay)}\n.st-l{font-family:var(--font-m);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg4)}\n\n/* ── Shared ── */\n.sec{padding:96px 0}.sec+.sec{border-top:1px solid var(--line)}\n.con{max-width:var(--max);margin:0 auto;padding:0 var(--g)}\n.eye{font-family:var(--font-m);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--clay);margin-bottom:14px}\n.sh{font-family:var(--font-d);font-weight:400;font-size:clamp(30px,3.8vw,48px);line-height:1.08;letter-spacing:-.02em;color:var(--fg)}\n.sh .it{font-style:italic;color:var(--clay)}\n\n/* ── Experience ── */\n.exp-list{display:flex;flex-direction:column;gap:0;margin-top:48px}\n.exp{padding:36px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:240px 1fr;gap:40px;align-items:start}\n.exp:first-child{padding-top:0}\n.exp-side{position:sticky;top:100px}\n.exp-co{font-size:18px;font-weight:700;color:var(--fg);margin-bottom:4px}\n.exp-role{font-size:14px;font-weight:600;color:var(--clay-g)}\n.exp-date{font-family:var(--font-m);font-size:11px;color:var(--fg4);letter-spacing:.04em;margin-top:6px}\n.exp-body h4{font-size:14px;font-weight:700;color:var(--fg);margin:20px 0 8px;letter-spacing:-.01em}\n.exp-body h4:first-child{margin-top:0}\n.exp-body ul{padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}\n.exp-body li{font-size:13.5px;line-height:1.6;color:var(--fg3);padding-left:18px;position:relative}\n.exp-body li::before{content:'';position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:999px;background:var(--clay);opacity:.5}\n.exp-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}\n.tag{font-family:var(--font-m);font-size:10px;letter-spacing:.05em;padding:4px 10px;border-radius:999px;font-weight:500}\n.tc{background:var(--clay-s);color:var(--clay-g);border:1px solid color-mix(in srgb,var(--clay) 25%,transparent)}\n.tn{background:var(--bg2);color:var(--fg3);border:1px solid var(--line2)}\n.tg{background:var(--gold-s);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 25%,transparent)}\n.ti{background:var(--info-s);color:var(--info);border:1px solid color-mix(in srgb,var(--info) 25%,transparent)}\n.metric{display:inline-flex;align-items:baseline;gap:4px;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:8px 14px;margin-top:10px;margin-right:8px}\n.metric-n{font-family:var(--font-d);font-size:28px;color:var(--fg);line-height:1}\n.metric-n .u{color:var(--clay);font-family:var(--font-s);font-size:16px}\n.metric-l{font-family:var(--font-m);font-size:10px;color:var(--fg4);letter-spacing:.06em;text-transform:uppercase}\n\n/* ── Side projects bento ── */\n.bento{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:48px}\n.card{background:var(--bg1);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:24px 26px;transition:border-color 200ms,box-shadow 200ms,transform 200ms var(--ease)}\n.card:hover{border-color:var(--line2);box-shadow:0 16px 48px rgba(0,0,0,.35);transform:translateY(-2px)}\n.card-span{grid-column:1/-1}\n.c-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}\n.c-name{font-size:17px;font-weight:700;color:var(--fg);margin-bottom:7px;letter-spacing:-.01em}\n.c-desc{font-size:13px;line-height:1.6;color:var(--fg3)}\n.c-stack{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}\n.c-stack span{font-family:var(--font-m);font-size:10px;color:var(--fg4);letter-spacing:.04em}\n\n/* ── Skills ── */\n.sk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:48px}\n.sk{background:var(--bg1);border:1px solid var(--line);border-radius:12px;padding:20px 22px;transition:border-color 200ms}\n.sk:hover{border-color:var(--line2)}\n.sk-cat{font-family:var(--font-m);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--clay);margin-bottom:12px}\n.sk-list{display:flex;flex-direction:column;gap:6px}\n.sk-list span{font-size:13px;font-weight:500;color:var(--fg2);display:flex;align-items:center;gap:7px}\n.sk-list span::before{content:'';width:4px;height:4px;border-radius:999px;background:var(--clay);opacity:.5;flex-shrink:0}\n\n/* ── Value prop ── */\n.vp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px}\n.vp{background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:28px 26px;position:relative;overflow:hidden}\n.vp::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--clay);opacity:.6}\n.vp-num{font-family:var(--font-d);font-size:48px;color:var(--fg);opacity:.12;position:absolute;top:10px;right:16px;line-height:1}\n.vp-title{font-size:16px;font-weight:700;color:var(--fg);margin-bottom:8px}\n.vp-desc{font-size:13px;line-height:1.6;color:var(--fg3)}\n\n/* ── Education ── */\n.edu-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:48px}\n.edu{background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:24px 26px}\n.edu-deg{font-size:16px;font-weight:700;color:var(--fg);margin-bottom:4px}\n.edu-school{font-size:14px;font-weight:500;color:var(--clay-g);margin-bottom:4px}\n.edu-date{font-family:var(--font-m);font-size:11px;color:var(--fg4);letter-spacing:.04em}\n\n/* ── About ── */\n.ab-grid{display:grid;grid-template-columns:3fr 2fr;gap:48px;margin-top:48px}\n.ab-body{font-size:16px;line-height:1.75;color:var(--fg3)}\n.ab-body p+p{margin-top:14px}\n.ab-body strong{color:var(--fg);font-weight:600}\n.ab-facts{display:flex;flex-direction:column;gap:12px}\n.fact{background:var(--bg1);border:1px solid var(--line);border-radius:10px;padding:16px 18px}\n.f-l{font-family:var(--font-m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg4);margin-bottom:4px}\n.f-v{font-size:13px;font-weight:600;color:var(--fg2)}\n\n/* ── Contact ── */\n#contact{padding:96px 0}\n.ct-card{background:var(--bg1);border:1px solid var(--line);border-radius:22px;padding:64px;display:flex;align-items:center;gap:48px;position:relative;overflow:hidden}\n.ct-card::before{content:'';position:absolute;top:-60px;right:-60px;width:280px;height:280px;background:radial-gradient(circle,color-mix(in srgb,var(--clay) 10%,transparent),transparent 70%);pointer-events:none}\n.ct-body{flex:1;position:relative;z-index:1}\n.ct-h{font-family:var(--font-d);font-weight:400;font-size:clamp(30px,3.5vw,48px);line-height:1.08;letter-spacing:-.02em;color:var(--fg);margin-bottom:14px}\n.ct-h .it{font-style:italic;color:var(--clay)}\n.ct-sub{font-size:15px;color:var(--fg3);margin-bottom:26px;line-height:1.6}\n.ct-deco{font-family:var(--font-d);font-size:130px;line-height:1;color:var(--clay);opacity:.07;user-select:none;flex-shrink:0}\n\n/* ── Company logos ── */\n.logos{max-width:var(--max);margin:0 auto;padding:32px var(--g);display:flex;align-items:center;gap:0;border-bottom:1px solid var(--line)}\n.logos-label{font-family:var(--font-m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg4);white-space:nowrap;margin-right:28px;flex-shrink:0}\n.logos-row{display:flex;align-items:center;gap:0;flex:1;justify-content:space-between}\n.logo-item{font-family:var(--font-s);font-size:18px;font-weight:800;letter-spacing:-.01em;color:var(--fg4);opacity:.55;transition:opacity 200ms}\n.logo-item:hover{opacity:.9}\n.logo-sep{width:1px;height:24px;background:var(--line);flex-shrink:0;margin:0 16px}\n\n/* ── Testimonials ── */\n.test-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:48px}\n.test{background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:26px 28px;position:relative}\n.test-quote{font-family:var(--font-d);font-size:22px;line-height:1.35;color:var(--fg);margin-bottom:16px;font-style:italic}\n.test-attr{display:flex;flex-direction:column;gap:2px}\n.test-name{font-size:13px;font-weight:700;color:var(--fg2)}\n.test-title{font-family:var(--font-m);font-size:11px;color:var(--fg4);letter-spacing:.04em}\n.test-mark{position:absolute;top:14px;right:20px;font-family:var(--font-d);font-size:56px;color:var(--clay);opacity:.15;line-height:1}\n\n/* ── Blog ── */\n.blog-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:48px}\n.blog-card{background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:24px 26px;transition:border-color 200ms,transform 200ms var(--ease)}\n.blog-card:hover{border-color:var(--line2);transform:translateY(-2px)}\n.blog-cat{font-family:var(--font-m);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--clay);margin-bottom:10px}\n.blog-title{font-size:16px;font-weight:700;color:var(--fg);margin-bottom:8px;line-height:1.3}\n.blog-desc{font-size:13px;line-height:1.55;color:var(--fg3)}\n.blog-date{font-family:var(--font-m);font-size:11px;color:var(--fg4);margin-top:14px;letter-spacing:.04em}\n\n/* ── Terminal hero ── */\n.terminal{background:var(--bg1);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-top:32px;max-width:520px;font-family:var(--font-m);font-size:12px;line-height:1.8;color:var(--fg3);overflow:hidden}\n.term-bar{display:flex;gap:6px;margin-bottom:12px}\n.term-dot{width:10px;height:10px;border-radius:999px}\n.term-dot:nth-child(1){background:#e55a5a}\n.term-dot:nth-child(2){background:#e5c05a}\n.term-dot:nth-child(3){background:#5ae56e}\n.term-cmd{color:var(--clay-g)}\n.term-out{color:var(--fg3)}\n.term-cursor{display:inline-block;width:7px;height:14px;background:var(--clay);animation:blink 1s step-end infinite;vertical-align:text-bottom}\n@keyframes blink{50%{opacity:0}}\n\n/* ── Photo placeholder ── */\n.photo-placeholder{width:100px;height:100px;border-radius:999px;background:var(--bg2);border:2px dashed var(--line2);display:flex;align-items:center;justify-content:center;font-family:var(--font-m);font-size:10px;color:var(--fg4);text-align:center;letter-spacing:.06em;flex-shrink:0}\n\n/* ── Resume btn ── */\n.btn-resume{display:inline-flex;align-items:center;gap:8px;background:var(--bg2);color:var(--fg2);font-family:var(--font-m);font-size:12px;font-weight:500;letter-spacing:.04em;text-decoration:none;padding:10px 18px;border-radius:8px;border:1px solid var(--line2);transition:border-color 120ms,background 120ms}\n.btn-resume:hover{border-color:var(--clay);background:var(--bg3)}\n\n/* ── Footer ── */\nfooter{border-top:1px solid var(--line);padding:24px var(--g);display:flex;align-items:center;justify-content:space-between;max-width:var(--max);margin:0 auto}\n.f-logo{font-family:var(--font-d);font-size:17px;color:var(--fg);letter-spacing:-.02em}\n.f-logo .d{color:var(--clay)}\n.f-copy{font-family:var(--font-m);font-size:11px;color:var(--fg4)}\n\n@media(max-width:860px){\n  :root{--g:20px}\n  .bento,.sk-grid{grid-template-columns:1fr}\n  .card-span{grid-column:auto}\n  .ab-grid{grid-template-columns:1fr}\n  .st-in{grid-template-columns:1fr 1fr;gap:18px}\n  .st{border-right:none;padding-left:0}\n  .exp{grid-template-columns:1fr;gap:12px}\n  .exp-side{position:static}\n  .ct-card{flex-direction:column;padding:36px 28px}\n  .ct-deco{display:none}\n  nav .n-links{display:none}\n  .n-badge{display:none}\n  .test-grid,.blog-grid{grid-template-columns:1fr}\n  .vp-grid{grid-template-columns:1fr 1fr}\n  .logos-row{flex-wrap:wrap;gap:12px}\n  .logo-sep{display:none}\n  .terminal{max-width:100%}\n}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n<!-- NAV -->\n<nav>\n  <a class=\"n-logo\" href=\"#hero\">Abhijeet<span class=\"d\">.<\u002Fspan><\u002Fa>\n  <div class=\"n-links\">\n    <a href=\"#value\">Why Me<\u002Fa>\n    <a href=\"#experience\">Experience<\u002Fa>\n    <a href=\"#projects\">Projects<\u002Fa>\n    <a href=\"#skills\">Skills<\u002Fa>\n    <a href=\"#education\">Education<\u002Fa>\n    <a href=\"#contact\">Contact<\u002Fa>\n  <\u002Fdiv>\n  <div class=\"n-right\">\n    <span class=\"n-badge\">Open to Staff · Principal roles<\u002Fspan>\n    <button class=\"n-tog\" id=\"themeToggle\" title=\"Toggle theme\">☀️<\u002Fbutton>\n    <a class=\"n-cta\" href=\"mailto:abhijeet.jupadhye@gmail.com\">Hire me →<\u002Fa>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- HERO -->\n<div id=\"hero\">\n  <p class=\"h-eye rv\">13+ Years · Senior · Staff · Principal<\u002Fp>\n  <h1 class=\"h-h1 rv d1\">\n    Seasoned engineer who <span class=\"it\">architects<\u002Fspan><br>\n    systems that outlast the sprint.\n  <\u002Fh1>\n  <p class=\"h-sub rv d2\">\n    13+ years designing scalable, distributed, event-driven systems for enterprise cloud.\n    From kernel-level encryption at Symantec to 1000 RPS GraphQL APIs at Wayfair.\n    Seeking Staff and Principal roles to drive architecture at scale.\n  <\u002Fp>\n  <div class=\"h-acts rv d3\">\n    <a class=\"bp\" href=\"#experience\">See my experience<\u002Fa>\n    <a class=\"bs\" href=\"#contact\">Get in touch<\u002Fa>\n    <a class=\"btn-resume\" href=\"uploads/AbhijeetUpadhyeResume.pdf\" download=\"\">↓ Download Resume<\u002Fa>\n  <\u002Fdiv>\n\n  <!-- Terminal intro -->\n  <div class=\"terminal rv d3\">\n    <div class=\"term-bar\"><span class=\"term-dot\"><\u002Fspan><span class=\"term-dot\"><\u002Fspan><span class=\"term-dot\"><\u002Fspan><\u002Fdiv>\n    <div><span class=\"term-cmd\">$ whoami<\u002Fspan><\u002Fdiv>\n    <div class=\"term-out\">abhijeet.upadhye // staff engineer<\u002Fdiv>\n    <div><span class=\"term-cmd\">$ cat experience.txt<\u002Fspan><\u002Fdiv>\n    <div class=\"term-out\">13 yrs | wayfair, symantec, proofpoint, tcs<\u002Fdiv>\n    <div><span class=\"term-cmd\">$ echo $STACK<\u002Fspan><\u002Fdiv>\n    <div class=\"term-out\">java kotlin spring kafka graphql aws gcp k8s<\u002Fdiv>\n    <div><span class=\"term-cmd\">$ ./status<\u002Fspan><\u002Fdiv>\n    <div class=\"term-out\">open to staff + principal roles <span class=\"term-cursor\"><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- COMPANY LOGOS -->\n<div class=\"logos\">\n  <span class=\"logos-label\">Trusted by<\u002Fspan>\n  <div class=\"logos-row\">\n    <span class=\"logo-item\">Wayfair<\u002Fspan>\n    <span class=\"logo-sep\"><\u002Fspan>\n    <span class=\"logo-item\">Symantec<\u002Fspan>\n    <span class=\"logo-sep\"><\u002Fspan>\n    <span class=\"logo-item\">Broadcom<\u002Fspan>\n    <span class=\"logo-sep\"><\u002Fspan>\n    <span class=\"logo-item\">Proofpoint<\u002Fspan>\n    <span class=\"logo-sep\"><\u002Fspan>\n    <span class=\"logo-item\">TCS<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- STATS -->\n<div id=\"stats\">\n  <div class=\"st-in\">\n    <div class=\"st rv\"><span class=\"st-n\"><span class=\"ctr\" data-target=\"13\">0<\u002Fspan><span class=\"u\">+<\u002Fspan><\u002Fspan><span class=\"st-l\">Years Engineering<\u002Fspan><\u002Fdiv>\n    <div class=\"st rv d1\"><span class=\"st-n\"><span class=\"ctr\" data-target=\"4\">0<\u002Fspan><\u002Fspan><span class=\"st-l\">Enterprise Companies<\u002Fspan><\u002Fdiv>\n    <div class=\"st rv d2\"><span class=\"st-n\"><span class=\"ctr\" data-target=\"90\">0<\u002Fspan><span class=\"u\">%<\u002Fspan><\u002Fspan><span class=\"st-l\">Latency Reduced<\u002Fspan><\u002Fdiv>\n    <div class=\"st rv d3\"><span class=\"st-n\"><span class=\"ctr\" data-target=\"1000\">0<\u002Fspan><\u002Fspan><span class=\"st-l\">RPS GraphQL APIs<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- VALUE PROPOSITION -->\n<section class=\"sec\" id=\"value\">\n  <div class=\"con\">\n    <p class=\"eye rv\">Why Hire Me<\u002Fp>\n    <h2 class=\"sh rv d1\">What I bring to <span class=\"it\">your team.<\u002Fspan><\u002Fh2>\n    <div class=\"vp-grid\">\n      <div class=\"vp rv\">\n        <span class=\"vp-num\">01<\u002Fspan>\n        <div class=\"vp-title\">Architectural Breadth<\u002Fdiv>\n        <div class=\"vp-desc\">From Windows kernel and UEFI pre boot to reactive microservices on Kubernetes. I have shipped at every layer of the stack. I make architecture decisions informed by 13 years of seeing what works and what does not.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"vp rv d1\">\n        <span class=\"vp-num\">02<\u002Fspan>\n        <div class=\"vp-title\">Measurable Impact<\u002Fdiv>\n        <div class=\"vp-desc\">90% latency reduction. 1000 RPS APIs. Observability adopted as the gold standard. SLO dashboards that reduced MTTR. I do not just write code. I move metrics that matter to the business.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"vp rv d2\">\n        <span class=\"vp-num\">03<\u002Fspan>\n        <div class=\"vp-title\">Force Multiplier<\u002Fdiv>\n        <div class=\"vp-desc\">I mentor engineers, produce C4 diagrams and RFCs, translate OKRs into tech specs, and run design walkthroughs. I make the team around me faster and more aligned. That is the hallmark of Staff+ impact.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"vp rv\">\n        <span class=\"vp-num\">04<\u002Fspan>\n        <div class=\"vp-title\">Polyglot &amp; Multi-stack<\u002Fdiv>\n        <div class=\"vp-desc\">Java, Kotlin, Python, TypeScript, C++. I pick the right tool for the job. Spring Boot, FastAPI, Node, reactive and non-reactive. I am not wedded to one stack. I am wedded to good engineering.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"vp rv d1\">\n        <span class=\"vp-num\">05<\u002Fspan>\n        <div class=\"vp-title\">Production-Grade Instincts<\u002Fdiv>\n        <div class=\"vp-desc\">Blue Green deployments, distributed caching, Kafka event streaming, schema registries, CloudFormation, Helm charts. I build systems that run in production, not just in demos. Security, observability, and operability are first class.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"vp rv d2\">\n        <span class=\"vp-num\">06<\u002Fspan>\n        <div class=\"vp-title\">Stakeholder Fluency<\u002Fdiv>\n        <div class=\"vp-desc\">I partner with Product, Analytics, Release Engineering, and external vendors. I translate business goals into architecture, write the spec, build consensus, and deliver. Comfortable from board room to terminal.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- EXPERIENCE -->\n<section id=\"experience\" class=\"sec\">\n  <div class=\"con\">\n    <p class=\"eye rv\">Experience<\u002Fp>\n    <h2 class=\"sh rv d1\">Production <span class=\"it\">track record.<\u002Fspan><\u002Fh2>\n\n    <div class=\"exp-list\">\n\n      <!-- Wayfair -->\n      <div class=\"exp rv\">\n        <div class=\"exp-side\">\n          <div class=\"exp-co\">Wayfair LLC<\u002Fdiv>\n          <div class=\"exp-role\">Senior Software Engineer · Tech Lead<\u002Fdiv>\n          <div class=\"exp-date\">May 2022 — Present<\u002Fdiv>\n          <div class=\"exp-tags\">\n            <span class=\"tag tc\">Java · Kotlin<\u002Fspan>\n            <span class=\"tag tn\">Spring Webflux<\u002Fspan>\n            <span class=\"tag tn\">Kafka<\u002Fspan>\n            <span class=\"tag tg\">GraphQL<\u002Fspan>\n            <span class=\"tag ti\">GCP<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:14px\">\n            <div class=\"metric\"><span class=\"metric-n\">90<span class=\"u\">%<\u002Fspan><\u002Fspan><span class=\"metric-l\">latency cut<\u002Fspan><\u002Fdiv>\n            <div class=\"metric\"><span class=\"metric-n\">1K<\u002Fspan><span class=\"metric-l\">RPS<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"exp-body\">\n          <h4>Catalog API Development<\u002Fh4>\n          <ul>\n            <li>Led design to deployment of high performance bulk GraphQL APIs for catalog management using Java, Kotlin, Kafka, and Spring Webflux. Supported 1000 RPS for PIM vendors (Salsify, CommerceBear).<\u002Fli>\n            <li>Integrated Redis cache and Postgres via Google Cloud SQL. Used DDD and Hexagonal architecture for modular, testable systems.<\u002Fli>\n            <li>Architected isolated sandbox environments for GraphQL APIs enabling safe validation and accelerated onboarding.<\u002Fli>\n          <\u002Ful>\n          <h4>Performance Engineering<\u002Fh4>\n          <ul>\n            <li>Reduced downstream latency by 90% (7s → 300ms) by reengineering the service from Python to Java.<\u002Fli>\n            <li>Replaced static databases with in-memory resource files, implemented two-tier Caffeine + Redis cache, and eliminated redundant network calls.<\u002Fli>\n          <\u002Ful>\n          <h4>Observability &amp; Architecture<\u002Fh4>\n          <ul>\n            <li>Designed observability pipeline for reactive GraphQL APIs using Datadog and BigQuery. Correlated upstream/downstream metrics, reducing MTTR.<\u002Fli>\n            <li>Built SLO/SLI dashboards and synthetic tests adopted as the gold standard across multiple teams.<\u002Fli>\n            <li>Produced C4 diagrams, API flow charts; translated OKRs into Tech Specs and RFCs aligning multiple teams.<\u002Fli>\n          <\u002Ful>\n          <h4>AI-Driven Testing &amp; Leadership<\u002Fh4>\n          <ul>\n            <li>Harnessed Google Gemini to auto generate GraphQL test inputs, adapting to evolving taxonomy. Accelerated coverage, slashed manual effort.<\u002Fli>\n            <li>Mentored junior engineers, interns, and contractors. Hosted team knowledge-sharing on Kotlin and reactive programming. Code quality gatekeeper across Catalog APIs.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Proofpoint -->\n      <div class=\"exp rv\">\n        <div class=\"exp-side\">\n          <div class=\"exp-co\">Proofpoint Inc<\u002Fdiv>\n          <div class=\"exp-role\">Senior Software Engineer<\u002Fdiv>\n          <div class=\"exp-date\">Feb 2022 — May 2022<\u002Fdiv>\n          <div class=\"exp-tags\">\n            <span class=\"tag tc\">Java<\u002Fspan>\n            <span class=\"tag tn\">Spring Boot<\u002Fspan>\n            <span class=\"tag tn\">Redis<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"exp-body\">\n          <h4>SIEM Integration<\u002Fh4>\n          <ul>\n            <li>Engineered microservice to enable SIEM integration with Microsoft Graph Security API.<\u002Fli>\n            <li>Utilized ShedLock for reliable distributed Cron jobs; implemented two tier Redis + Guava cache reducing redundant API calls.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Symantec/Broadcom -->\n      <div class=\"exp rv\">\n        <div class=\"exp-side\">\n          <div class=\"exp-co\">Symantec / Broadcom<\u002Fdiv>\n          <div class=\"exp-role\">Staff → Principal Software Engineer<\u002Fdiv>\n          <div class=\"exp-date\">Jun 2014 — Dec 2021<\u002Fdiv>\n          <div class=\"exp-tags\">\n            <span class=\"tag tc\">Java · C++<\u002Fspan>\n            <span class=\"tag tn\">Spring Boot<\u002Fspan>\n            <span class=\"tag tn\">AWS<\u002Fspan>\n            <span class=\"tag tg\">RabbitMQ<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"exp-body\">\n          <h4>DRM Encryption &amp; Data Loss Prevention<\u002Fh4>\n          <ul>\n            <li>Led development of encryption features to secure files flagged by the DLP engine, intercepted via CASB.<\u002Fli>\n            <li>Designed REST microservices with Spring Boot, JPA/Hibernate, Aurora RDS, and RabbitMQ.<\u002Fli>\n            <li>Migrated incident match highlighting and RBAC from legacy system to Spring Boot on premises backend. Improved policy creation, rule management, and incident response.<\u002Fli>\n          <\u002Ful>\n          <h4>AWS Orchestration &amp; Deployment<\u002Fh4>\n          <ul>\n            <li>Engineered scalable, high availability production environment with autoscaling across multiple Availability Zones.<\u002Fli>\n            <li>Configured CloudWatch monitoring, VPC and IAM for secure access. Orchestrated Blue Green deployments via CloudFormation for minimal downtime.<\u002Fli>\n          <\u002Ful>\n          <h4>Kernel-Level Encryption (C++)<\u002Fh4>\n          <ul>\n            <li>Enhanced Symantec Whole Disk Encryption to support hardware encryption on OPAL specification drives.<\u002Fli>\n            <li>Implemented TCG-compliant changes in the Windows kernel, UEFI pre boot, and user-mode layers.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- TCS -->\n      <div class=\"exp rv\">\n        <div class=\"exp-side\">\n          <div class=\"exp-co\">Tata Consultancy Services<\u002Fdiv>\n          <div class=\"exp-role\">Systems Engineer<\u002Fdiv>\n          <div class=\"exp-date\">Nov 2009 — Aug 2012<\u002Fdiv>\n          <div class=\"exp-tags\">\n            <span class=\"tag tn\">C++<\u002Fspan>\n            <span class=\"tag tg\">Fortune 500<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"exp-body\">\n          <h4>64-bit Migration<\u002Fh4>\n          <ul>\n            <li>Migrated critical HP NonStop Middleware from ILP32 to LP64 architecture in C++.<\u002Fli>\n            <li>Fixed mission critical defects for Fortune 500 clients: Daimler, Mercedes-Benz, and Wells Fargo.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- KEY PROJECTS -->\n<section id=\"projects\" class=\"sec\">\n  <div class=\"con\">\n    <p class=\"eye rv\">Key Projects<\u002Fp>\n    <h2 class=\"sh rv d1\">Systems I've <span class=\"it\">shipped.<\u002Fspan><\u002Fh2>\n    <div class=\"bento\">\n\n      <!-- Catalog API -->\n      <div class=\"card card-span rv\">\n        <div class=\"c-tags\"><span class=\"tag tc\">Wayfair<\u002Fspan><span class=\"tag tn\">Java · Kotlin<\u002Fspan><span class=\"tag tn\">Spring Webflux<\u002Fspan><span class=\"tag tg\">1000 RPS<\u002Fspan><\u002Fdiv>\n        <div class=\"c-name\">Catalog GraphQL API Platform<\u002Fdiv>\n        <div class=\"c-desc\">Led design to deployment of high performance bulk GraphQL APIs for Wayfair's Catalog management. Consumed by PIM vendors (Salsify, CommerceBear) at 1000 RPS. Built on Spring Webflux with Kafka for event streaming, Redis cache, Postgres via Google Cloud SQL. Designed with DDD and Hexagonal architecture. Architected isolated sandbox environments for safe testing and accelerated vendor onboarding.<\u002Fdiv>\n        <div class=\"c-stack\"><span>Spring Webflux<\u002Fspan><span>·<\u002Fspan><span>Kafka<\u002Fspan><span>·<\u002Fspan><span>GraphQL (DGS)<\u002Fspan><span>·<\u002Fspan><span>Redis<\u002Fspan><span>·<\u002Fspan><span>Cloud SQL<\u002Fspan><span>·<\u002Fspan><span>Hexagonal<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Performance re-architecture -->\n      <div class=\"card rv\">\n        <div class=\"c-tags\"><span class=\"tag tc\">Wayfair<\u002Fspan><span class=\"tag tg\">90% faster<\u002Fspan><\u002Fdiv>\n        <div class=\"c-name\">Latency Re-architecture<\u002Fdiv>\n        <div class=\"c-desc\">Reduced downstream service latency by 90% (7s to 300ms) by reengineering the application from Python to Java. Replaced static databases with in memory resource files, implemented a two tier Caffeine + Redis cache, and consolidated service logic to eliminate redundant network calls.<\u002Fdiv>\n        <div class=\"c-stack\"><span>Java<\u002Fspan><span>·<\u002Fspan><span>Caffeine<\u002Fspan><span>·<\u002Fspan><span>Redis<\u002Fspan><span>·<\u002Fspan><span>Performance<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Observability -->\n      <div class=\"card rv d1\">\n        <div class=\"c-tags\"><span class=\"tag tc\">Wayfair<\u002Fspan><span class=\"tag ti\">Datadog<\u002Fspan><\u002Fdiv>\n        <div class=\"c-name\">Observability Pipeline<\u002Fdiv>\n        <div class=\"c-desc\">Designed comprehensive observability for reactive GraphQL APIs using Datadog and BigQuery. Correlated upstream/downstream metrics and payloads for system health insights and reduced MTTR. Built SLO/SLI dashboards and synthetic tests adopted as the gold standard across teams.<\u002Fdiv>\n        <div class=\"c-stack\"><span>Datadog<\u002Fspan><span>·<\u002Fspan><span>BigQuery<\u002Fspan><span>·<\u002Fspan><span>SLO/SLI<\u002Fspan><span>·<\u002Fspan><span>Synthetic Tests<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- AI Testing -->\n      <div class=\"card rv\">\n        <div class=\"c-tags\"><span class=\"tag tc\">Wayfair<\u002Fspan><span class=\"tag tg\">AI<\u002Fspan><\u002Fdiv>\n        <div class=\"c-name\">AI-Driven Test Automation<\u002Fdiv>\n        <div class=\"c-desc\">Harnessed Google Gemini (Vertex AI) to auto generate GraphQL API test inputs, adapting on the fly to evolving taxonomy requirements. Accelerated test data creation, improved coverage, and slashed manual preparation effort.<\u002Fdiv>\n        <div class=\"c-stack\"><span>Vertex AI<\u002Fspan><span>·<\u002Fspan><span>Gemini<\u002Fspan><span>·<\u002Fspan><span>GraphQL<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SIEM -->\n      <div class=\"card rv d1\">\n        <div class=\"c-tags\"><span class=\"tag tc\">Proofpoint<\u002Fspan><span class=\"tag tn\">Spring Boot<\u002Fspan><\u002Fdiv>\n        <div class=\"c-name\">SIEM Integration<\u002Fdiv>\n        <div class=\"c-desc\">Engineered microservice for SIEM integration with Microsoft Graph Security API. Orchestrated reliable distributed Cron jobs via ShedLock for periodic malicious file hash retrieval. Implemented two tier Redis + Guava cache reducing redundant API calls.<\u002Fdiv>\n        <div class=\"c-stack\"><span>Spring Boot<\u002Fspan><span>·<\u002Fspan><span>Redis<\u002Fspan><span>·<\u002Fspan><span>ShedLock<\u002Fspan><span>·<\u002Fspan><span>MS Graph<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- DLP / DRM -->\n      <div class=\"card rv\">\n        <div class=\"c-tags\"><span class=\"tag tc\">Symantec<\u002Fspan><span class=\"tag tn\">Spring Boot<\u002Fspan><span class=\"tag tn\">AWS<\u002Fspan><\u002Fdiv>\n        <div class=\"c-name\">Information Protection &amp; DLP<\u002Fdiv>\n        <div class=\"c-desc\">Led encryption features securing sensitive files flagged by the DLP engine and intercepted via CASB. Designed REST microservices with Spring Boot, JPA/Hibernate, Aurora RDS, and RabbitMQ. Migrated RBAC and incident management from legacy to Spring Boot. Engineered scalable AWS deployment with autoscaling, CloudFormation, and Blue Green upgrades.<\u002Fdiv>\n        <div class=\"c-stack\"><span>Spring Boot<\u002Fspan><span>·<\u002Fspan><span>RabbitMQ<\u002Fspan><span>·<\u002Fspan><span>Aurora RDS<\u002Fspan><span>·<\u002Fspan><span>CloudFormation<\u002Fspan><span>·<\u002Fspan><span>Blue Green<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Kernel encryption -->\n      <div class=\"card rv d1\">\n        <div class=\"c-tags\"><span class=\"tag tc\">Symantec<\u002Fspan><span class=\"tag tn\">C++<\u002Fspan><span class=\"tag tn\">Kernel<\u002Fspan><\u002Fdiv>\n        <div class=\"c-name\">Whole Disk Encryption (PGP)<\u002Fdiv>\n        <div class=\"c-desc\">Enhanced Symantec WDE to support hardware encryption on OPAL specification drives. Implemented Trusted Computing Group (TCG) compliant changes in the Windows kernel, UEFI pre boot environment, and user-mode layers. Built C++ utility to recover locked disks using PGP Server universal keys across 10,000 machine deployments.<\u002Fdiv>\n        <div class=\"c-stack\"><span>C++<\u002Fspan><span>·<\u002Fspan><span>Windows Kernel<\u002Fspan><span>·<\u002Fspan><span>UEFI<\u002Fspan><span>·<\u002Fspan><span>OPAL<\u002Fspan><span>·<\u002Fspan><span>TCG<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 64-bit migration -->\n      <div class=\"card rv\">\n        <div class=\"c-tags\"><span class=\"tag tc\">TCS<\u002Fspan><span class=\"tag tg\">Fortune 500<\u002Fspan><\u002Fdiv>\n        <div class=\"c-name\">64-bit Platform Migration<\u002Fdiv>\n        <div class=\"c-desc\">Migrated critical HP NonStop Middleware products from ILP32 (32-bit) to LP64 (64-bit) architecture in C++. Fixed mission critical defects for Fortune 500 clients including Daimler, Mercedes-Benz, and Wells Fargo.<\u002Fdiv>\n        <div class=\"c-stack\"><span>C++<\u002Fspan><span>·<\u002Fspan><span>HP NonStop<\u002Fspan><span>·<\u002Fspan><span>ILP32 → LP64<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <!-- Personal projects (collapsed) -->\n    <details style=\"margin-top:40px\">\n      <summary style=\"font-family:var(--font-m);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);cursor:pointer;padding:12px 0\">Personal / Side Projects ↓<\u002Fsummary>\n      <div class=\"bento\" style=\"margin-top:16px\">\n        <div class=\"card\">\n          <div class=\"c-tags\"><span class=\"tag tn\">Spring Boot 3.5<\u002Fspan><span class=\"tag tn\">Java 21<\u002Fspan><span class=\"tag tn\">K8s<\u002Fspan><\u002Fdiv>\n          <div class=\"c-name\">Platform Infra — Ecommerce Monolith<\u002Fdiv>\n          <div class=\"c-desc\">Full ecommerce platform with Java 21 virtual threads, 18+ Kafka streams, Avro schema registry, Elasticsearch, Redis, Keycloak OAuth2, GraphQL (Netflix DGS), WebSockets, Helm/K8s, GitLab CI.<\u002Fdiv>\n          <div class=\"c-stack\"><span>Java 21<\u002Fspan><span>·<\u002Fspan><span>Kafka<\u002Fspan><span>·<\u002Fspan><span>Elasticsearch<\u002Fspan><span>·<\u002Fspan><span>Helm<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <div class=\"c-tags\"><span , Digital Enterprise Architect<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-family:var(--font-m);font-size:11px;color:var(--fg4);margin-top:20px;letter-spacing:.04em\">Source: LinkedIn recommendations<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- BLOG / WRITING -->\n<section class=\"sec\" id=\"writing\">\n  <div class=\"con\">\n    <p class=\"eye rv\">Writing<\u002Fp>\n    <h2 class=\"sh rv d1\">Notes on <span class=\"it\">craft.<\u002Fspan><\u002Fh2>\n    <div class=\"blog-grid\">\n      <div class=\"blog-card rv\">\n        <div class=\"blog-cat\">Architecture<\u002Fdiv>\n        <div class=\"blog-title\">Why I chose a monolith over microservices for my side project<\u002Fdiv>\n        <div class=\"blog-desc\">A monolith is not a dirty word. When you are one engineer exploring 18 Kafka streams, the deployment surface matters more than the org chart.<\u002Fdiv>\n        <div class=\"blog-date\">Coming soon<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"blog-card rv d1\">\n        <div class=\"blog-cat\">Performance<\u002Fdiv>\n        <div class=\"blog-title\">From 7 seconds to 300 milliseconds. A latency story.<\u002Fdiv>\n        <div class=\"blog-desc\">How I re architected a Python service into Java, added two tier caching, and removed three redundant network calls to hit 90% faster.<\u002Fdiv>\n        <div class=\"blog-date\">Coming soon<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"blog-card rv d2\">\n        <div class=\"blog-cat\">Leadership<\u002Fdiv>\n        <div class=\"blog-title\">Writing RFCs that actually get read<\u002Fdiv>\n        <div class=\"blog-desc\">The difference between an RFC that ships and one that rots in Confluence. Structure, diagrams, and knowing when to stop writing.<\u002Fdiv>\n        <div class=\"blog-date\">Coming soon<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- EDUCATION -->\n<section class=\"sec\" id=\"education\">\n  <div class ons (hexagonal/layered × reactive/non-reactive) in Java and Kotlin. I learn by building, and I build at production grade.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ab-facts rv d1\">\n        <div style=\"display:flex;justify-content:center;margin-bottom:16px\">\n          <img src=\"c23a67ec-8a34-446d-932f-8c95ffa423ea\" alt=\"Abhijeet Upadhye\" style=\"width:120px;height:120px;border-radius:999px;object-fit:cover;border:3px solid var(--line2)\">\n        <\u002Fdiv>\n        <div class=\"fact\"><div class=\"f-l\">Looking for<\u002Fdiv><div class=\"f-v\">Staff Engineer · Principal Engineer<\u002Fdiv><\u002Fdiv>\n        <div class=\"fact\"><div class=\"f-l\">Education<\u002Fdiv><div class=\"f-v\">MS Software Engineering, San Jose State University<\u002Fdiv><\u002Fdiv>\n        <div class=\"fact\"><div class=\"f-l\">Depth<\u002Fdiv><div class=\"f-v\">Distributed systems · Platform engineering<\u002Fdiv><\u002Fdiv>\n        <div class=\"fact\"><div class=\"f-l\">Primary stacks<\u002Fdiv><div class=\"f-v\">Java 21 · Kotlin · Spring Boot · Kafka · AWS · GCP<\u002Fdiv><\u002Fdiv>\n        <div class=\"fact\"><div class=\"f-l\">Based in<\u002Fdiv><div class=\"f-v\">San Jose, CA · Open to remote &amp; hybrid<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CONTACT -->\n<section id=\"contact\">\n  <div class=\"con\">\n    <div class=\"ct-card rv\">\n      <div class=\"ct-body\">\n        <p class=\"eye\" style=\"margin-bottom:14px\">Get in touch<\u002Fp>\n        <h2 class=\"ct-h\">Let's build something <span class=\"it\">hard.<\u002Fspan><\u002Fh2>\n        <p class=\"ct-sub\">Open to Staff and Principal Engineering roles. 13 years of architectural breadth, kernel to cloud, production grade instincts, measurable impact (90% latency cuts, 1000 RPS APIs), and a track record of making teams faster. MS Software Engineering, San Jose State University.<\u002Fp>\n        <div style=\"display:flex;gap:14px;flex-wrap:wrap;align
