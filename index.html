2A2010;\n  --info:#5BA4C9;--info-s:#182830;\n  --font-d:'Instrument Serif',Georgia,serif;\n  --font-s:'Hanken Grotesk',system-ui,sans-serif;\n  --font-m:'JetBrains Mono',monospace;\n  --ease:cubic-bezier(0.22,1,0.36,1);\n  --max:1100px;--g:40px;\n}\n[data-theme=\"light\"]{\n  --bg:#FBF8F3;--bg1:#F5EFE5;--bg2:#EFE7D9;--bg3:#E8DFCF;\n  --fg:#1A1611;--fg2:#3D362D;--fg3:#6B6155;--fg4:#9A8F7F;\n  --line:#E3D9C9;--line2:#D2C5AF;\n  --clay-s:#FBEFE9;--gold-s:#F1E2C4;--info-s:#DEF0F8;\n}\nhtml{scroll-behavior:smooth}\nbody{background:var(--bg);color:var(--fg2);font-family:var(--font-s);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}\n::selection{background:var(--clay-s);color:var(--clay-g)}\n\n/* ── Nav ── */\nnav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:6px;padding:14px var(--g);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}\n.n-logo{font-family:var(--font-d);font-size:21px;letter-spacing:-.02em;color:var(--fg);text-decoration:none;margin-right:18px;flex-shrink:0}\n.n-logo .d{color:var(--clay)}\n.n-links{display:flex;gap:2px}\n.n-links a{font-size:13px;font-weight:500;color:var(--fg3);text-decoration:none;padding:6px 10px;border-radius:6px;transition:color 120ms,background 120ms}\n.n-links a:hover{color:var(--fg);background:var(--bg2)}\n.n-right{margin-left:auto;display:flex;align-items:center;gap:10px}\n.n-badge{font-family:var(--font-m);font-size:10px;letter-spacing:.04em;padding:5px 12px;background:var(--clay-s);color:var(--clay-g);border:1px solid color-mix(in srgb,var(--clay) 30%,transparent);border-radius:999px;white-space:nowrap}\n.n-tog{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;cursor:pointer;font-size:15px;transition:background 120ms}\n.n-tog:hover{background:var(--bg3)}\n.n-  class=\"d\">.<\u002Fspan><\u002Fa>\n  <div class=\"n-links\">\n    <a href=\"#value\">Why Me<\u002Fa>\n    <a href=\"#experience\">Experience<\u002Fa>\n    <a href=\"#projects\">Projects<\u002Fa>\n    <a href=\"#skills\">Skills<\u002Fa>\n    <a href=\"#education\">Education<\u002Fa>\n    <a href=\"#contact\">Contact<\u002Fa>\n  <\u002Fdiv>\n  <div class=\"n-right\">\n    <span class=\"n-badge\">Open to Staff · Principal roles<\u002Fspan>\n    <button class=\"n-tog\" id=\"themeToggle\" title=\"Toggle theme\">☀️<\u002Fbutton>\n    \n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- HERO -->\n<div id=\"hero\">\n  <p class=\"h-eye rv\">13+ Years · Senior · Staff · Principal<\u002Fp>\n  <h1 class=\"h-h1 rv d1\">\n    Seasoned engineer who <span class=\"it\">architects<\u002Fspan><br>\n    systems that outlast the sprint.\n  <\u002Fh1>\n  <p class=\"h-sub rv d2\">\n    13+ years designing scalable, distributed, event-driven systems for enterprise cloud.\n    From kernel-level encryption at Symantec to 1000 RPS GraphQL APIs at Wayfair.\n    Seeking Staff and Principal roles to drive architecture at scale.\n  <\u002Fp>\n  <div class=\"h-acts rv d3\">\n    <a class=\"bp\" href=\"#experience\">See my experience<\u002Fa>\n    <a class=\"bs\" href=\"#contact\">Get in touch<\u002Fa>\n    \n  <\u002Fdiv>\n\n  <!-- Terminal intro -->\n  <div class=\"terminal rv d3\">\n    <div class=\"term-bar\"><span class=\"term-dot\"><\u002Fspan><span class=\"term-dot\"><\u002Fspan><span class=\"term-dot\"><\u002Fspan><\u002Fdiv>\n    <div><span class=\"term-cmd\">$ whoami<\u002Fspan><\u002Fdiv>\n    <div class=\"term-out\">abhijeet.upadhye // staff engineer<\u002Fdiv>\n    <div><span class=\"term-cmd\">$ cat experience.txt<\u002Fspan><\u002Fdiv>\n    <div class=\"term-out\">13 yrs | wayfair, symantec, proofpoint, tcs<\u002Fdiv>\n    <div><span class=\"term-cmd\">$ echo $STACK<\u002Fspan><\u002Fdiv>\n    <div class=\"term-out\">java kotlin spring kafka graphql aws gcp k8s<\u002Fdiv>\n    <div><span class=\"t rchitectural Breadth<\u002Fdiv>\n        <div class=\"vp-desc\">From Windows kernel and UEFI pre boot to reactive microservices on Kubernetes. I have shipped at every layer of the stack. I make architecture decisions informed by 13 years of seeing what works and what does not.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"vp rv d1\">\n        <span class=\"vp-num\">02<\u002Fspan>\n        <div class=\"vp-title\">Measurable Impact<\u002Fdiv>\n        <div class=\"vp-desc\">90% latency reduction. 1000 RPS APIs. Observability adopted as the gold standard. SLO dashboards that reduced MTTR. I do not just write code. I move metrics that matter to the business.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"vp rv d2\">\n        <span class=\"vp-num\">03<\u002Fspan>\n        <div class=\"vp-title\">Force Multiplier<\u002Fdiv>\n        <div class=\"vp-desc\">I mentor engineers, produce C4 diagrams and RFCs, translate OKRs into tech specs, and run design walkthroughs. I make the team around me faster and more aligned. That is the hallmark of Staff+ impact.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"vp rv\">\n        <span class=\"vp-num\">04<\u002Fspan>\n        <div class=\"vp-title\">Polyglot &amp; Multi-stack<\u002Fdiv>\n        <div class=\"vp-desc\">Java, Kotlin, Python, TypeScript, C++. I pick the right tool for the job. Spring Boot, FastAPI, Node, reactive and non-reactive. I am not wedded to one stack. I am wedded to good engineering.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"vp rv d1\">\n        <span class=\"vp-num\">05<\u002Fspan>\n        <div class=\"vp-title\">Production-Grade Instincts<\u002Fdiv>\n        <div class=\"vp-desc\">Blue Green deployments, distributed caching, Kafka event streaming, schema registries, CloudFormation, Helm charts. I build systems that run in production, not just in demos. Security, observability, and operability are first class.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"vp rv d2\">\n        <span class=\ Kotlin<\u002Fspan><span class=\"tag tn\">Spring Webflux<\u002Fspan><span class=\"tag tg\">1000 RPS<\u002Fspan><\u002Fdiv>\n        <div class=\"c-name\">Catalog GraphQL API Platform<\u002Fdiv>\n        <div class=\"c-desc\">Led design to deployment of high performance bulk GraphQL APIs for Wayfair's Catalog management. Consumed by PIM vendors (Salsify, CommerceBear) at 1000 RPS. Built on Spring Webflux with Kafka for event streaming, Redis cache, Postgres via Google Cloud SQL. Designed with DDD and Hexagonal architecture. Architected isolated sandbox environments for safe testing and accelerated vendor onboarding.<\u002Fdiv>\n        <div class=\"c-stack\"><span>Spring Webflux<\u002Fspan><span>·<\u002Fspan><span>Kafka<\u002Fspan><span>·<\u002Fspan><span>GraphQL (DGS)<\u002Fspan><span>·<\u002Fspan><span>Redis<\u002Fspan><span>·<\u002Fspan><span>Cloud SQL<\u002Fspan><span>·<\u002Fspan><span>Hexagonal<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Performance re-architecture -->\n      <div class=\"card rv\">\n        <div class=\"c-tags\"><span class=\"tag tc\">Wayfair<\u002Fspan><span class=\"tag tg\">90% faster<\u002Fspan><\u002Fdiv>\n        <div class=\"c-name\">Latency Re-architecture<\u002Fdiv>\n        <div class=\"c-desc\">Reduced downstream service latency by 90% (7s to 300ms) by reengineering the application from Python to Java. Replaced static databases with in memory resource files, implemented a two tier Caffeine + Redis cache, and consolidated service logic to eliminate redundant network calls.<\u002Fdiv>\n        <div class=\"c-stack\"><span>Java<\u002Fspan><span>·<\u002Fspan><span>Caffeine<\u002Fspan><span>·<\u002Fspan><span>Redis<\u002Fspan><span>·<\u002Fspan><span>Performance<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Observability -->\n      <div class=\"card rv d1\">\n        <div class=\"c-tags\"><span class=\"tag tc\">Wayfair<\u002Fspan><span class=\"tag ti\">Datadog<\u002Fspan><\u002Fdiv>\n        <div class=\"c-name\">Observability Pipeline<\u002Fdiv>\n        <div class=\"c-desc\">Designed comprehensive observability for reactive GraphQL APIs using Datadog and BigQuery. Correlated upstream/downstream metrics and payloads for system health insights and reduced MTTR. Built SLO/SLI dashboards and synthetic tests adopted as the gold standard across teams.<\u002Fdiv>\n        <div class=\"c-stack\"><span>Datadog<\u002Fspan><span>·<\u002Fspan><span>BigQuery<\u002Fspan><span>·<\u002Fspan><span>SLO/SLI<\u002Fspan><span>·<\u002Fspan><span>Synthetic Tests<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- AI Testing -->\n      <div class=\"card rv\">\n        <div class=\"c-tags\"><span class=\"tag tc\">Wayfair<\u002Fspan><span class=\"tag tg\">AI<\u002Fspan><\u002Fdiv>\n        <div class=\"c-name\">AI-Driven Test Automation<\u002Fdiv>\n        <div class=\"c-desc\">Harnessed Google Gemini (Vertex AI) to auto generate GraphQL API test inputs, adapting on the fly to evolving taxonomy requirements. Accelerated test data creation, improved coverage, and slashed manual preparation effort.<\u002Fdiv>\n        <div class=\"c-stack\"><span>Vertex AI<\u002Fspan><span>·<\u002Fspan><span>Gemini<\u002Fspan><span>·<\u002Fspan><span>GraphQL<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SIEM -->\n      <div class=\"card rv d1\">\n        <div class=\"c-tags\"><span class=\"tag tc\">Proofpoint<\u002Fspan><span class=\"tag tn\">Spring Boot<\u002Fspan><\u002Fdiv>\n        <div class=\"c-name\">SIEM Integration<\u002Fdiv>\n        <div class=\"c-desc\">Engineered microservice for SIEM integration with Microsoft Graph Security API. Orchestrated reliable distributed Cron jobs via ShedLock for periodic malicious file hash retrieval. Implemented two tier Redis + Guava cache reducing redundant API calls.<\u002Fdiv>\n        <div class=\"c-stack\"><span>Spring Boot<\u002Fspan><span>·<\u002Fspan><span>Redis<\u002Fspan><span>·<\u002Fspan><span>ShedLock<\u002Fspan><span>·<\u002Fspan><span>MS Graph<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- DLP / DRM -->\n      <div class=\"card rv\">\n        <div class=\"c-tags\"><span class=\"tag tc\">Symantec<\u002Fspan><span class=\"tag tn\">Spring Boot<\u002Fspan><span class=\"tag tn\">AWS<\u002Fspan><\u002Fdiv>\n        <div class=\"c-name\">Information Protection &amp; DLP<\u002Fdiv>\n        <div class=\"c-desc\">Led encryption features securing sensitive files flagged by the DLP engine and intercepted via CASB. Designed REST microservices with Spring Boot, JPA/Hibernate, Aurora RDS, and RabbitMQ. Migrated RBAC and incident management from legacy to Spring Boot. Engineered scalable AWS deployment with autoscaling, CloudFormation, and Blue Green upgrades.<\u002Fdiv>\n        <div class=\"c-stack\"><span>Spring Boot<\u002Fspan><span>·<\u002Fspan><span>RabbitMQ<\u002Fspan><span>·<\u002Fspan><span>Aurora RDS<\u002Fspan><span>·<\u002Fspan><span>CloudFormation<\u002Fspan><span>·<\u002Fspan><span>Blue Green<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Kernel encryption -->\n      <div class=\"card rv d1\">\n        <div class=\"c-tags\"><span class=\"tag tc\">Symantec<\u002Fspan><span class=\"tag tn\">C++<\u002Fspan><span class=\"tag tn\">Kernel<\u002Fspan><\u002Fdiv>\n        <div class=\"c-name\">Whole Disk Encryption (PGP)<\u002Fdiv>\n        <div class=\"c-desc\">Enhanced Symantec WDE to support hardware encryption on OPAL specification drives. Implemented Trusted Computing Group (TCG) compliant changes in the Windows kernel, UEFI pre boot environment, and user-mode layers. Built C++ utility to recover locked disks using PGP Server universal keys across 10,000 machine deployments.<\u002Fdiv>\n        <div class=\"c-stack\"><span>C++<\u002Fspan><span>·<\u002Fspan><span>Windows Kernel<\u002Fspan><span>·<\u002Fspan><span>UEFI<\u002Fspan><span>·<\u002Fspan><span>OPAL<\u002Fspan><span>·<\u002Fspan><span>TCG<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 64-bit migration -->\n      <div class=\"card " style=\"font-size:13px;font-weight:700;color:var(--fg2);text-decoration:none\">Andrew Tavares<\u002Fa>\n          <span class=\"test-title\">Engineering Leader, Wayfair<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"test rv\">\n        <span class=\"test-mark\">“<\u002Fspan>\n        <div class=\"test-quote\">An invaluable teammate known for his problem solving skills, mentorship, and ability to quickly handle API issues. His work on building dashboards has set a strong foundation for performance tracking. His collaboration, technical expertise, and dedication make a significant impact.<\u002Fdiv>\n        <div class=\"test-attr\">\n          <a href=\"https://www.linkedin.com/in/abhijeet-upadhye-78574536/details/recommendations/\" target=\"_blank\" rel=\"noopener\" style=\"font-size:13px;font-weight:700;color:var(--fg2);text-decoration:none\">Thanh Nguyen<\u002Fa>\n          <span class=\"test-title\">Software Engineer, Wayfair<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"test rv d1\">\n        <span class=\"test-mark\">“<\u002Fspan>\n        <div class=\"test-quote\">Once a task is given to him, you can be assured he will do what all it takes to make it done. There had been lots of technical challenges in the 64 bit program, and most of it he resolved without any external assistance. One of the highly performing team members who has gone beyond the call of duty multiple times.<\u002Fdiv>\n        <div class=\"test-attr\">\n          <a href=\"https://www.linkedin.com/in/abhijeet-upadhye-78574536/details/recommendations/\" target=\"_blank\" rel=\"noopener\" style=\"font-size:13px;font-weight:700;color:var(--fg2);text-decoration:none\">Ani Dandekar<\u002Fa>\n          <span class=\"test-title\">Business Transformation Specialist, Digital Enterprise Architect<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-family:var(--font-m);font-size:11px;color:var(--fg4);margin-top:20px;letter-spacing:.04em\">Source: LinkedIn recommendations<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- BLOG / WRITING -->\n<section class=\"sec\" id=\"writing\">\n  <div class=\"con\">\n    <p class=\"eye rv\">Writing<\u002Fp>\n    <h2 class=\"sh rv d1\">Notes on <span class=\"it\">craft.<\u002Fspan><\u002Fh2>\n    <div class=\"blog-grid\">\n      <div class=\"blog-card rv\">\n        <div class=\"blog-cat\">Architecture<\u002Fdiv>\n        <div class=\"blog-title\">Why I chose a monolith over microservices for my side project<\u002Fdiv>\n        <div class=\"blog-desc\">A monolith is not a dirty word. When you are one engineer exploring 18 Kafka streams, the deployment surface matters more than the org chart.<\u002Fdiv>\n        <div class=\"blog-date\">Coming soon<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"blog-card rv d1\">\n        <div class=\"blog-cat\">Performance<\u002Fdiv>\n        <div class=\"blog-title\">From 7 seconds to 300 milliseconds. A latency story.<\u002Fdiv>\n        <div class=\"blog-desc\">How I re architected a Python service into Java, added two tier caching, and removed three redundant network calls to hit 90% faster.<\u002Fdiv>\n        <div class=\"blog-date\">Coming soon<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"blog-card rv d2\">\n        <div class=\"blog-cat\">Leadership<\u002Fdiv>\n        <div class=\"blog-title\">Writing RFCs that actually get read<\u002Fdiv>\n        <div class=\"blog-desc\">The difference between an RFC that ships and one that rots in Confluence. Structure, diagrams, and knowing when to stop writing.<\u002Fdiv>\n        <div class=\"blog-date\">Coming soon<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- EDUCATION -->\n<section class=\"sec\" id=\"education\">\n  <div class=\"con\">\n    <p class=\"eye rv\">Education<\u002Fp>\n    <h2 class=\"sh rv d1\">Academic <span class=\"it\">foundation.<\u002Fspan><\u002Fh2>\n    <div class=\"edu-grid\">\n      <div class=\"edu rv\">\n        <div class=\"edu-deg\">MS — Software Engineering<\u002Fdiv>\n        <div class=\"edu-school\">San Jose State University<\u002Fdiv>\n        <div class=\"edu-date\">2012 — 2014<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"edu rv d1\">\n        <div class=\"edu-deg\">BE — Computer Engineering<\u002Fdiv>\n        <div class=\"edu-school\">Dharmsinh Desai University<\u002Fdiv>\n        <div class=\"edu-date\">2005 — 2009<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ABOUT -->\n<section id=\"about\" class=\"sec\">\n  <div class=\"con\">\n    <p class=\"eye rv\">About<\u002Fp>\n    <h2 class=\"sh rv d1\">Engineer by discipline,<br><span class=\"it\">architect<\u002Fspan> by instinct.<\u002Fh2>\n    <div class=\"ab-grid\">\n      <div class=\"ab-body rv\">\n        <p><strong>13+ years from kernel level C++ to cloud native microservices.<\u002Fstrong> I started at TCS fixing mission critical defects for Daimler and Wells Fargo. Then I spent seven years at Symantec building encryption products, from UEFI pre boot to Spring Boot REST APIs to AWS production infrastructure, rising from intern to Principal Engineer.<\u002Fp>\n        <p>At Wayfair I lead Catalog API development. <strong>1000 RPS reactive GraphQL APIs<\u002Fstrong> on Spring Webflux. A <strong>90% latency reduction<\u002Fstrong> through a full stack re architecture. The observability pipeline other teams now copy. I design systems, mentor engineers, and translate OKRs into technical specs that ship on time.<\u002Fp>\n        <p>My side projects mirror my production instincts. I am building a <strong>full ecommerce platform from scratch<\u002Fstrong> on Java 21, Kafka, Elasticsearch, and Kubernetes. I am also exploring all four architecture pattern combinations (hexagonal/layered × reactive/non-reactive) in Java and Kotlin. I learn by building, and I build at production grade.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ab-facts rv d1\">\
